<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
  async function baixarPDF(){
    const btn = document.getElementById('btnBaixar');
    const msg = document.getElementById('tbMsg');
    btn.disabled = true; btn.textContent = 'Gerando PDF…';
    document.body.classList.add('exportando');
    try{
      await html2pdf().set({
        margin: 0,
        filename: 'Croqui-Festival-do-Xis-2026.pdf',
        image: { type:'jpeg', quality: 0.95 },
        html2canvas: { scale: 2, useCORS: true, scrollY: 0, backgroundColor: '#ffffff' },
        jsPDF: { unit:'mm', format:'a4', orientation:'landscape' },
        pagebreak: { mode: ['css','legacy'] }
      }).from(document.getElementById('docCroqui')).save();
      msg.textContent = 'PDF baixado — confira na pasta Downloads';
    }catch(e){
      msg.textContent = 'Falha ao gerar — use Imprimir e salve como PDF';
    }
    document.body.classList.remove('exportando');
    btn.disabled = false; btn.textContent = '⬇️ Baixar PDF';
  }
</script>
